[package]
name = "wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The core↔terminal protocol: messages, framing and session rules."

[dependencies]
domain = { workspace = true }
exchange = { workspace = true }

rmp-serde = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
zstd = { workspace = true }
rmpv = { workspace = true }
serde_bytes = { workspace = true }
tokio-rustls = { workspace = true }
x509-parser = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
ring = { workspace = true }
keyring = { workspace = true, optional = true }

[dev-dependencies]
rustls-pemfile = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tokio-tungstenite = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }

[features]
# The operating system credential store. Off by default: the core never needs it and
# would otherwise pull a D-Bus dependency onto a headless VPS.
os-keystore = ["dep:keyring"]
