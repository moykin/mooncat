[workspace]
resolver = "2"
# `crates/terminal` is intentionally its own workspace — see its Cargo.toml.
exclude = ["crates/terminal"]
members = [
    "crates/binance",
    "crates/core",
    "crates/domain",
    "crates/exchange",
    "crates/marketdata",
    "crates/wire",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
binance = { path = "crates/binance" }
domain = { path = "crates/domain" }
exchange = { path = "crates/exchange" }
marketdata = { path = "crates/marketdata" }
wire = { path = "crates/wire" }

async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", features = ["json"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
